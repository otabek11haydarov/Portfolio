<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="120" height="120" rx="28" fill="url(#bg)" />
  <rect x="2" y="2" width="116" height="116" rx="26" fill="none" stroke="url(#borderGlow)" stroke-width="2.5" />

  <!-- Code icon </> -->
  <g transform="translate(8, 36)" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left bracket < -->
    <path d="M 15 8 L 6 24 L 15 40" />
    <!-- Slash / -->
    <path d="M 28 6 L 21 42" />
    <!-- Right bracket > -->
    <path d="M 34 8 L 43 24 L 34 40" />
  </g>

  <!-- OH. text -->
  <text x="59" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" font-weight="900" font-size="36" fill="#ffffff" letter-spacing="-0.5">
    OH<tspan fill="#38bdf8">.</tspan>
  </text>
</svg>
